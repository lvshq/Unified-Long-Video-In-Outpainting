name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install ruff==0.11.13 'numpy<2' pillow imageio
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q diffsynth examples scripts gen_SSIM_LPIPS.py gen_clip_score.py gen_tLPIPS.py
      - run: ruff check diffsynth/pipelines/wan_video.py diffsynth/pipelines/wan_video_utils.py examples/wanvideo/train_wan_t2v.py scripts gen_SSIM_LPIPS.py gen_clip_score.py gen_tLPIPS.py tests
      - run: python -m unittest discover -s tests -v
